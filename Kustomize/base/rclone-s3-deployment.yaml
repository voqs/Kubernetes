---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rclone-proxy
  namespace: rclone-s3
  labels:
    app: rclone-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rclone-proxy
  template:
    metadata:
      labels:
        app: rclone-proxy
    spec:
      containers:
        - name: rclone
          image: rclone/rclone:1.73
          args:
            - serve
            - s3
            - --addr
            - :80
            - --auth-key
            - $(S3_ACCESS_KEY_ID),$(S3_SECRET_ACCESS_KEY)
            - --config
            - /config/rclone.conf
            - "filen:"
          envFrom:
            - secretRef:
                name: rclone
          env:
            - name: S3_ACCESS_KEY_ID
              value: access_key_id
            - name: S3_SECRET_ACCESS_KEY
              value: secret_access_key
          ports:
            - containerPort: 80
